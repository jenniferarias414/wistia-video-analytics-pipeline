name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m py_compile src/ingestion/wistia_ingest.py
          python -m py_compile src/transformation/transform_wistia.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: Check for accidentally tracked local secret files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "Tracked .env file detected."
            exit 1
          fi

          echo "No tracked .env files found."
